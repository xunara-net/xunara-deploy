# 容器内 nginx：同源托管两个前端，API 反代到 compose 里的 server 服务。
upstream xunara_control {
    server server:9090;
    keepalive 32;
}

map $http_upgrade $xunara_connection_upgrade {
    default upgrade;
    ''      close;
}

map $request_method $xunara_browser_write {
    default 1;
    GET     0;
    HEAD    0;
}

server {
    listen 80;
    server_name _;

    root /srv/xunara/web;
    index index.html;

    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $xunara_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    # 只代理退役入口，不再提供第二套控制台；根和租户书签使用相同迁移规则。
    location ~ "^/(t/[a-z0-9][a-z0-9-]{0,31}/)?console(/.*)?$" {
        proxy_pass http://xunara_control;
    }
    location ~ "^/(t/[a-z0-9][a-z0-9-]{0,31}/)?ui/prefs$" {
        proxy_pass http://xunara_control;
    }
    location ~ "^/t/[a-z0-9][a-z0-9-]{0,31}/login/?$" {
        proxy_pass http://xunara_control;
    }
    location ~ "^/t/[a-z0-9][a-z0-9-]{0,31}/(api/v[12]/.*|oidc/callback/.*|oauth2/callback/.*)$" {
        proxy_pass http://xunara_control;
    }
    # 官方客户端给出的浏览器 URL 保持不变，所有授权状态都由新前端展示。
    location ~ "^/(t/[a-z0-9][a-z0-9-]{0,31}/)?(login/?|setup/?|signup/?|logout/?|register(/.*)?|ssh/check/.*|device/.*)$" {
        if ($xunara_browser_write) {
            return 410;
        }
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }
    location /passkey/ {
        return 410;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ~ ^/(api/.*|key|ts2021|health|version|derp/.*|\.well-known/.*|oidc/.*|oauth2/.*) {
        proxy_pass http://xunara_control;
    }

    # 检查器按原文下载，禁止把旧命令重定向至新语言或 SPA。
    location = /network-check.sh {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location = /network-check.py {
        return 410;
    }


    location = /admin {
        if ($xunara_browser_write) { return 410; }
        return 301 /admin/;
    }
    location /admin/ {
        if ($xunara_browser_write) { return 410; }
        root /srv/xunara;
        try_files $uri $uri/ /admin/index.html;
    }
    location ~ ^/(login|register|dashboard|devices|network|topology|permissions|members|dns|routes|api|security|plan|audit|settings|reset-password|change-password)(/.*)?$ {
        try_files $uri $uri/ /index.html;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
