# 容器内 nginx：同源托管两个前端，API 反代到 compose 里的 server 服务。
upstream xunara_control {
    server server:9090;
    keepalive 32;
}

map $http_upgrade $xunara_connection_upgrade {
    default upgrade;
    ''      close;
}

map $request_method $xunara_legacy_login {
    default 0;
    POST    1;
}

server {
    listen 80;
    server_name _;

    root /srv/xunara/web;
    index index.html;

    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $xunara_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    location ~ ^/(api/.*|key|ts2021|health|version|derp/.*|\.well-known/.*|setup|signup|logout|passkey/.*|oidc/.*|oauth2/.*|register/.*|ssh/check/.*|console|console/.*) {
        proxy_pass http://xunara_control;
    }

    location = /login {
        error_page 418 = @xunara_legacy_login;
        if ($xunara_legacy_login) {
            return 418;
        }
        try_files /index.html =404;
    }
    location @xunara_legacy_login {
        proxy_pass http://xunara_control;
    }

    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }
    location ~ ^/(login|register|dashboard|devices|network|topology|permissions|members|dns|routes|api|security|plan|audit|settings)(/.*)?$ {
        try_files $uri $uri/ /index.html;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
