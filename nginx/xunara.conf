# Xunara 同源站点：用户控制台(xunara-web) + 超级管理后台(xunara-admin) + 控制面 API。
#
# 为什么必须同源：用户控制台使用 HttpOnly + SameSite=Lax 的会话 Cookie，跨源前端
# 会丢登录态。因此一个 server 同时承担：
#   /                     → /srv/xunara/web    （xunara-web 构建产物）
#   /admin/               → /srv/xunara/admin  （xunara-admin 构建产物）
#   控制面路径            → 127.0.0.1:9090     （xunarad）
#
# 安装：sudo ./install-web.sh <web/dist> [admin/dist]
# 端口 9091 的 DERP 中继不经过 nginx：客户端用证书指纹直连，TLS 必须由中继自己
# 终止，nginx 反代会破坏指纹固定。

upstream xunara_control {
    server @XUNARA_UPSTREAM@;
    keepalive 32;
}

map $http_upgrade $xunara_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen @XUNARA_HTTP_PORT_IPV4@;
    listen [::]:@XUNARA_HTTP_PORT@;
    server_name _;

    root /srv/xunara/web;
    index index.html;

    # Flux 上传与长轮询：给足体积和超时。
    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $xunara_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    # ---- 控制面 API 与客户端协议端点 ----
    # 只匹配后端真实存在的路径；/api 是用户控制台的「API 密钥」页面，不能反代。
    location ~ ^/(api/.*|key|ts2021|health|version|derp/.*|\.well-known/.*|login|setup|signup|logout|passkey/.*|oidc/.*|register/.*|ssh/check/.*|console|console/.*) {
        proxy_pass http://xunara_control;
    }

    # ---- 超级管理员后台（独立前端，vite base=/admin/）----
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- 用户控制台 SPA ----
    # 显式列出前端路由，新增页面时同步这里，否则会被上面的后端规则吃掉。
    location ~ ^/(login|register|dashboard|devices|network|topology|permissions|members|dns|routes|api|security|plan|audit|settings)(/.*)?$ {
        try_files $uri $uri/ /index.html;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存：文件名带内容哈希时才可以长缓存。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /admin/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# HTTPS 示例：通行密钥（WebAuthn）要求安全上下文，用域名 + 证书后：
#   1) 把下面 server 块的 listen 443 ssl 打开并按需填证书路径；
#   2) 控制面单元改成 -server-url https://你的域名 -passkey=true；
#   3) 80 端口只保留 301 跳转。
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name xunara.example.com;
#     ssl_certificate     /etc/letsencrypt/live/xunara.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/xunara.example.com/privkey.pem;
#     # 其余 location 与上面的 server 块保持一致。
# }
