# Xunara 同源站点：用户控制台(xunara-web) + 超级管理后台(xunara-admin) + 控制面 API。
#
# 为什么必须同源：用户控制台使用 HttpOnly + SameSite=Lax 的会话 Cookie，跨源前端
# 会丢登录态。因此一个 server 同时承担：
#   /                     → /srv/xunara/web    （xunara-web 构建产物）
#   /admin/               → /srv/xunara/admin  （xunara-admin 构建产物）
#   控制面路径            → 127.0.0.1:9090     （xunarad）
#
# 安装：sudo ./install-web.sh <web/dist> [admin/dist]
# 端口 9091 的 DERP 中继不经过 nginx：客户端用证书指纹直连，TLS 必须由中继自己
# 终止，nginx 反代会破坏指纹固定。

upstream xunara_control {
    server @XUNARA_UPSTREAM@;
    keepalive 32;
}

# map hash 设置必须出现在全部 map 之前，避免 nginx 提前初始化后报告重复。
@XUNARA_HTTP_UPGRADE_MAP@

map $http_upgrade $xunara_connection_upgrade {
    default upgrade;
    ''      close;
}

# 用户控制台的登录页是 SPA 路由，但旧版表单登录仍然 POST 到控制面的
# /login。用 map 把「方法」变成写死的位置选择：GET/HEAD 走 SPA，其余
# 方法交给控制面，避免 proxy_pass 与 try_files 在同一 location 里打架。
map $request_method $xunara_legacy_login {
    default 0;
    POST    1;
}

server {
    listen @XUNARA_HTTP_PORT_IPV4@;
    listen [::]:@XUNARA_HTTP_PORT@;
    server_name _;

    root /srv/xunara/web;
    index index.html;

@XUNARA_TLS_SETTINGS@

    # Flux 上传与长轮询：给足体积和超时。
    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $xunara_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    # ---- 控制面 API 与客户端协议端点 ----
    # 租户浏览器授权按路径隔离；原生 Noise 由可选共享入口按精确机器/节点对路由。
    location ~ "^/t/[a-z0-9][a-z0-9-]{0,31}/(api/v[12]/.*|oidc/callback/.*|oauth2/callback/.*|register/.*|ssh/check/.*)$" {
        proxy_pass http://xunara_control;
    }
    # 只匹配后端真实存在的路径；/api 是用户控制台的「API 密钥」页面，不能反代。
    location ~ ^/(api/.*|key|ts2021|health|version|derp/.*|\.well-known/.*|setup|signup|logout|passkey/.*|oidc/.*|oauth2/.*|device/.*|register/.*|ssh/check/.*|console|console/.*) {
        proxy_pass http://xunara_control;
    }

    # /login 的 GET 属于用户控制台；POST 是控制面的旧版表单登录。
    location = /login {
        error_page 418 = @xunara_legacy_login;
        if ($xunara_legacy_login) {
            return 418;
        }
        try_files /index.html =404;
    }
    location @xunara_legacy_login {
        proxy_pass http://xunara_control;
    }

    # ---- 超级管理员后台（独立前端，vite base=/admin/）----
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        # 这里的 root 是 /srv/xunara（而不是 server 级的 /srv/xunara/web），
        # 否则 /admin/index.html 会解析到 /srv/xunara/web/admin/... 造成内部
        # 重定向死循环（nginx 返回 500）。
        root /srv/xunara;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- 用户控制台 SPA ----
    # 显式列出前端路由，新增页面时同步这里，否则会被上面的后端规则吃掉。
    location ~ ^/(login|register|dashboard|devices|network|topology|permissions|members|dns|routes|api|security|plan|audit|settings|reset-password|change-password)(/.*)?$ {
        try_files $uri $uri/ /index.html;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存：文件名带内容哈希时才可以长缓存。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /admin/assets/ {
        root /srv/xunara;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# HTTP / HTTPS 共用本模板，由 render.py 校验并渲染，不再复制第二套 locations。
# HTTPS origins、证书与控制面 URL 的配置边界见 nginx/README.md。
