name: deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          sh -n install.sh
          sh -n install-web.sh

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -s sh install.sh install-web.sh

      - name: Render systemd units
        run: |
          # 用安装脚本同样的占位符替换语法渲染一遍，能发现忘写的 @变量@。
          sed -e 's|@XUNARA_SERVER_URL@|http://example.com|' \
              -e 's|@XUNARA_PASSKEY@|false|' \
              -e 's|@XUNARA_EXTRA_ARGS@||' \
              systemd/xunarad.service > /tmp/xunarad.service
          sed -e 's|@XUNARA_DERP_HOST@|derp.example.com|' \
              -e 's|@XUNARA_DERP_PORT@|9091|' \
              -e 's|@XUNARA_RELAY_MODE_ARGS@|-verify-url http://127.0.0.1:9090/derp/admit|' \
              -e 's|@XUNARA_STUN_ARGS@|-stun=false|' \
              systemd/xunara-relay.service > /tmp/xunara-relay.service
          ! grep -q '@XUNARA_' /tmp/xunarad.service /tmp/xunara-relay.service

      - name: nginx config test
        run: |
          # 本机部署配置：上游是 127.0.0.1:9090，可直接在本 runner 校验。
          docker run --rm -v "$PWD/nginx/xunara.conf:/etc/nginx/conf.d/xunara.conf:ro" \
            nginx:1.27-alpine nginx -t
          # compose 配置：上游主机名 server 只在容器网络里可解析，用 --add-host 补齐。
          docker run --rm --add-host server:127.0.0.1 \
            -v "$PWD/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: docker compose config
        run: |
          cp docker/xunara.env.example docker/.env
          docker compose -f docker/docker-compose.yml --env-file docker/.env config --quiet
